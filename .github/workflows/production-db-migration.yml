name: Production DB Migration (Manual)

# Manual-only. Must never run on push/PR/deploy.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE-PRODUCTION to run `prisma migrate deploy` against the live Neon production database'
        required: true
        type: string

permissions:
  contents: read

# Prevent two migration runs from ever overlapping.
concurrency:
  group: production-db-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Prisma migrate deploy (production)
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        if: ${{ github.event.inputs.confirm != 'MIGRATE-PRODUCTION' }}
        run: |
          echo "Confirmation input did not match 'MIGRATE-PRODUCTION'. Aborting without touching the database." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (lockfile-safe)
        run: npm ci

      - name: Verify DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not configured. Aborting without touching the database." >&2
            exit 1
          fi

      - name: Prisma migrate status (before)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          STATUS_OUTPUT="$(npx prisma migrate status 2>&1)"
          STATUS_EXIT=$?
          set -e

          echo "$STATUS_OUTPUT"

          if [ "$STATUS_EXIT" -eq 0 ]; then
            echo "::notice::Migration status: database is already up to date."
          elif [ "$STATUS_EXIT" -eq 1 ] && printf '%s' "$STATUS_OUTPUT" | grep -qF "To apply migrations in production run"; then
            # This exact phrase is only emitted by `prisma migrate status` for the
            # "database is behind, pending migrations exist" diagnostic — the
            # expected pre-deploy state. It is not emitted for connection errors,
            # config errors, schema drift, or diverged migration history, all of
            # which fall through to the failure branch below with their real
            # Prisma exit code.
            echo "::notice::Migration status: pending migrations detected (expected before deploy). Proceeding."
          else
            echo "::error::prisma migrate status failed with an unexpected error (exit $STATUS_EXIT). Not proceeding to migrate deploy."
            exit "$STATUS_EXIT"
          fi

      - name: Prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Prisma migrate status (after)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate status
